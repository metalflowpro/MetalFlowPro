# Railway builds this service with Nixpacks. Overriding the build phase makes the
# quality gates (typecheck + unit tests) run at deploy time, before the production
# build — `railway.json`'s buildCommand alone was not being applied.
#
# build:quality = "npm run typecheck && npm test && npm run build"
# The install phase (npm ci) still installs devDependencies (vite/tsc/vitest),
# and VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY are present as build variables,
# so both the tests and the production build succeed.
[phases.build]
cmds = ["npm run build:quality"]

# Vite 8 / rolldown exigent Node >= 20.19 ; le nodejs_20 de Nixpacks est en
# 20.18.1, ce qui empêche le chargement du binding natif rolldown et fait échouer
# build:quality. On épingle Node 22.
[variables]
NIXPACKS_NODE_VERSION = "22"
