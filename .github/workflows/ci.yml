name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Guard direct writes (P1.1)
        # Fige la dette : échoue si une nouvelle écriture supabase directe
        # apparaît hors de la couche de données S7 (baseline scripts/writes-baseline.json).
        run: python3 scripts/inventory_writes.py --check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          # Certains tests importent la couche supabase (ex. auditLog), dont le
          # module lève si l'env public est absent. Mêmes valeurs de repli que le
          # build : les vraies sont injectées via les secrets du dépôt.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Build
        run: npm run build
        env:
          # Build-time public env. Real values injected as repository secrets.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  sql-harness:
    name: SQL migrations · RLS tests (S1–S6)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Postgres est préinstallé sur ubuntu-latest (binaires sous /usr/lib/postgresql/*/bin).
      # Le banc reconstitue le minimum Supabase (rôles, auth.uid(), pgcrypto),
      # rejoue bootstrap + toutes les migrations, puis les tests RLS S1/S2/S3.
      - name: Run SQL harness
        run: bash supabase/tests/harness/run-migrations.sh
