name: Staging (migrations + déploiement)

# À chaque fusion sur main : migrations appliquées sur la base de STAGING, puis
# déploiement de l'environnement Railway « staging ». La production n'est
# jamais touchée ici : elle passe par scripts/release.sh, qui exige que staging
# ait déjà reçu toutes les migrations.
#
# Secrets :
#   SUPABASE_ACCESS_TOKEN — jeton personnel Supabase
#   RAILWAY_STAGING_TOKEN — jeton de projet Railway limité à l'environnement staging
# Sans eux, chaque étape correspondante est ignorée avec un avertissement.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrations → staging
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN absent — migrations staging ignorées."; echo "ready=false" >> "$GITHUB_OUTPUT"
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest
      - name: Appliquer les migrations sur staging
        if: steps.cfg.outputs.ready == 'true'
        run: bash scripts/db/migrate.sh staging --apply

  deploy:
    name: Déploiement → staging
    needs: migrate
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_STAGING_TOKEN absent — déploiement staging ignoré."; echo "ready=false" >> "$GITHUB_OUTPUT"
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - name: Déployer
        if: steps.cfg.outputs.ready == 'true'
        run: npx --yes @railway/cli@4 up --ci --service metalflowpro --environment staging
